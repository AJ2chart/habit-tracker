# Contrôle béton : toutes les vérifications automatiques, lancées à la main après une grosse évolution.
# Chaque étape tourne même si une précédente échoue ; le contrôle échoue à la fin s'il reste une alerte.
# Captures et rapport complet : artefact « controle-beton » de l'exécution.
name: Contrôle béton

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Lint (zéro alerte)
        id: lint
        continue-on-error: true
        run: |
          mkdir -p e2e-out
          npx expo lint --max-warnings 0 2>&1 | tee e2e-out/lint.txt
          exit ${PIPESTATUS[0]}

      - name: Enregistrer la configuration du lint si elle vient d'être créée
        run: |
          git add -A eslint.config.js package.json package-lock.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Configuration du lint (expo lint)"
            git pull --rebase -q && git push
          fi

      - name: TypeScript
        id: tsc
        continue-on-error: true
        run: |
          mkdir -p e2e-out
          npx tsc --noEmit 2>&1 | tee e2e-out/tsc.txt
          exit ${PIPESTATUS[0]}

      - name: Diagnostic Expo (expo-doctor)
        id: doctor
        continue-on-error: true
        run: |
          mkdir -p e2e-out
          npx expo-doctor 2>&1 | tee e2e-out/doctor.txt
          exit ${PIPESTATUS[0]}

      - name: Tests de la logique, de la base et de la sauvegarde
        id: unit
        continue-on-error: true
        # node:sqlite est marqué « expérimental » par Node 22 : seul cet avertissement-là est masqué.
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          mkdir -p e2e-out
          set -o pipefail
          { npx --yes tsx tests/logic.test.ts && npx --yes tsx tests/db.test.ts && npx --yes tsx tests/backup.test.ts; } 2>&1 | tee e2e-out/tests.txt

      - name: Préparer le navigateur de test
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Lancer la version web
        run: |
          npx expo start --web --port 8081 > web.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8081 > /dev/null; then break; fi
            sleep 5
          done
          # Premier chargement : laisse Metro préparer le bundle avant les mesures.
          curl -sf "http://localhost:8081/?seed=empty" > /dev/null || true

      - name: Contrôle visuel (débordements, textes, erreurs, interactions)
        id: visual
        continue-on-error: true
        run: node tests/e2e/visual.mjs

      - name: Publier le rapport sur la branche controle-beton-rapport
        if: always()
        run: |
          mkdir -p /tmp/rapport && cp -r e2e-out/*.txt e2e-out/rapport.md e2e-out/rapport.json /tmp/rapport/ 2>/dev/null || true
          mkdir -p /tmp/rapport/captures && cp e2e-out/*-telephone-dark-*.png e2e-out/*-petit-light-*.png e2e-out/*feuille*.png /tmp/rapport/captures/ 2>/dev/null || true
          cp web.log /tmp/rapport/ 2>/dev/null || true
          cd /tmp/rapport
          git init -q -b controle-beton-rapport
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Rapport du Contrôle béton ($GITHUB_RUN_ID)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" controle-beton-rapport

      - name: Garder le rapport et les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-beton
          path: |
            e2e-out/
            web.log

      - name: Bilan
        run: |
          echo "lint=${{ steps.lint.outcome }} tsc=${{ steps.tsc.outcome }} doctor=${{ steps.doctor.outcome }} tests=${{ steps.unit.outcome }} visuel=${{ steps.visual.outcome }}"
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.tsc.outcome }}" = success
          test "${{ steps.doctor.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.visual.outcome }}" = success
