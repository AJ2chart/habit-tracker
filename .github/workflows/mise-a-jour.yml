# Publie une mise à jour à distance (EAS Update) vers l'appli installée
# à chaque modification de la branche main.
# Nécessite le secret EXPO_TOKEN (Settings → Secrets and variables → Actions).
name: Mise à jour de l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        # npm install (et non npm ci) : ajoute les nouvelles dépendances pures JavaScript
        # déclarées dans package.json, même si package-lock.json n'a pas pu être mis à jour.
        run: npm install --no-audit --no-fund

      - name: Enregistrer package-lock.json s'il a changé
        # Garde le fichier de versions à jour pour les fabrications de l'appli (npm ci).
        # Un envoi fait avec le jeton de l'automatisation ne relance pas cette automatisation.
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Met à jour package-lock.json" package-lock.json
            git push
          fi

      - name: Vérifier le code (TypeScript)
        run: npx tsc --noEmit

      - name: Tester la logique
        run: |
          npx --yes tsx tests/logic.test.ts
          npx --yes tsx tests/backup.test.ts

      - name: Publier la mise à jour
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Mise à jour manuelle' }}
        run: eas update --channel preview --environment preview --message "$MESSAGE" --non-interactive
